name: fast
description: FAST Delivery Taiz Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  supabase_flutter: ^2.8.1
  onesignal_flutter: ^5.7.3
  shared_preferences: ^2.3.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: 10.1.4
  http: ^1.2.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.5
  flutter_local_notifications: 17.2.4
  google_maps_flutter: ^2.10.0
  
  # 💾 حزم التخزين المحلي وقاعدة البيانات (للعمل بدون إنترنت)
  sqflite: ^2.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
