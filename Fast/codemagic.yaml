workflows:
  build-apk-workflow:
    name: Build Android APK for FAST Delivery
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        # يمكنك إضافة مفاتيح السرية أو التوقيع هنا لاحقاً إذا احتجت
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Clean build cache
        script: |
          flutter clean
          flutter pub get
      - name: Build Debug/Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          # ضع بريدك الإلكتروني هنا إذا أردت أن يرسل لك كودماجيك الملف عليه
          - maeen@example.com
        notify:
          success: true
          failure: true
