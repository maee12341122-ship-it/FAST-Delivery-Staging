workflows:
  build-web-workflow:
    name: Build Web for FAST Delivery
    max_build_duration: 30
    environment:
      flutter: 3.22.2
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Clean build cache
        script: |
          flutter clean
          flutter pub get
      - name: Build Web Release
        script: |
          flutter build web --release
    artifacts:
      - build/web
    publishing:
      email:
        recipients:
          - maeen@example.com
        notify:
          success: true
          failure: true
