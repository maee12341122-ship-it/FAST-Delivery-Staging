workflows:
  fast-delivery-apk-web:
    name: FAST Delivery - APK + Web 🚀
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true

    scripts:
      - name: Flutter dependencies & Environment Check
        script: |
          flutter --version
          java -version
          flutter pub get

      - name: Diagnose Android Gradle & Build APK 📦
        script: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --info
          cd ..

      - name: Build Flutter Web 🌐
        script: |
          flutter build web --release --base-href /

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/web/**
