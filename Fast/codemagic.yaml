workflows:
  fast-delivery-android:
    name: FAST Delivery - Production APK Build 🚀
    max_build_duration: 60
    working_directory: Fast
    environment:
      flutter: 3.19.6
    cache:
      cache_paths: []
    scripts:
      - name: 1. Get Flutter Packages
        script: flutter pub get
        
      - name: 2. Enable Core Library Desugaring
        script: |
          python3 -c '
          path = "android/app/build.gradle.kts"
          with open(path, "r") as f:
              content = f.read()
          if "isCoreLibraryDesugaringEnabled" not in content:
              content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
          if "desugar_jdk_libs" not in content:
              if "dependencies {" in content:
                  content = content.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")")
              else:
                  content += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"
          with open(path, "w") as f:
              f.write(content)
          print("Desugaring enabled successfully!")
          '

      - name: 3. Build Release APK
        script: flutter build apk --release --android-skip-build-dependency-validation
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log
