workflows:
  fast-delivery-android:
    name: FAST Delivery - Cloud Build 🚀
    max_build_duration: 60
    working_directory: Fast
    environment:
      flutter: 3.19.6
    cache:
      cache_paths: []
    scripts:
      - name: 1. Generate Android folder automatically on cloud
        script: |
          if [ ! -d "android" ]; then
            echo "Android folder missing, generating a fresh one..."
            flutter create . --platforms=android --org com.maeen --project-name fast_delivery
          fi
      - name: 2. Get Flutter Packages
        script: flutter pub get
      - name: 3. Build APK Release
        script: flutter build apk --release --android-skip-build-dependency-validation
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log
