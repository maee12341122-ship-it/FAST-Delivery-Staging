
workflows:
  fast-delivery-apk-web:
    name: FAST Delivery - APK + Web
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      flutter: 3.50.0
      java: 17

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
        - pattern: master
          include: true
          source: false
      cancel_previous_builds: true

    scripts:
      - name: Flutter dependencies
        script: |
          flutter --version
          flutter pub get

      - name: Diagnose Android Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --info

      - name: Build Flutter Web
        script: |
          cd ..
          flutter build web --release --base-href /

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/web/**
