workflows:
  fast-delivery-android:
    name: FAST Delivery - Production APK Build 🚀
    max_build_duration: 60
    working_directory: Fast
    environment:
      flutter: 3.19.6
    cache:
      cache_paths: []
    scripts:
      - name: 1. Get Flutter Packages
        script: flutter pub get
        
      - name: 2. Build Release APK
        script: flutter build apk --release --android-skip-build-dependency-validation
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log
