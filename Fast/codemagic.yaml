# FAST Delivery - Codemagic workflows
# Project layout in the uploaded ZIP: repository-root/Fast/{pubspec.yaml,android,web,lib}
# Keep this file in the GitHub repository root (next to the Fast folder).

workflows:
  fast-taiz-web:
    name: FAST Delivery - Web
    working_directory: Fast
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        WEB_BASE_HREF: "/"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Check Flutter and web project
        script: |
          set -e
          flutter --version
          test -f pubspec.yaml
          test -f web/index.html
      - name: Enable Flutter Web
        script: flutter config --enable-web
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build production Web
        script: |
          set -e
          flutter build web --release --base-href "${WEB_BASE_HREF:-/}"
    artifacts:
      - Fast/build/web/**

  fast-taiz-android-release:
    name: FAST Delivery - Android APK + Google Play AAB
    working_directory: Fast
    max_build_duration: 90
    environment:
      flutter: stable
      android_signing:
        - fast_delivery_upload
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Check Flutter, Java and Android project
        script: |
          set -e
          flutter --version
          java -version
          test -f pubspec.yaml
          test -f android/settings.gradle
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.jar
      - name: Configure Android SDK paths for Codemagic
        script: |
          set -e
          if [ -z "${FLUTTER_ROOT:-}" ]; then
            echo "Codemagic did not provide FLUTTER_ROOT."
            exit 1
          fi
          ANDROID_SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK_PATH" ]; then
            echo "ANDROID_SDK_ROOT / ANDROID_HOME is missing."
            exit 1
          fi
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_PATH" > android/local.properties
          chmod +x android/gradlew
      - name: Verify Google Services configuration
        script: |
          set -e
          test -f android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("android/app/google-services.json").read_text(encoding="utf-8"))
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in data.get("client", [])
          ]
          expected = "com.maeen.fastdelivery"
          if expected not in packages:
              raise SystemExit(
                  f"google-services.json has no Android client for {expected}. Found: {packages}"
              )
          print(f"Firebase Android package verified: {expected}")
          PY
      - name: Get Flutter packages
        script: flutter pub get
      - name: Verify Android upload signing key
        script: |
          set -e
          for name in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing Android signing value: $name. Check Code signing identities in Codemagic."
              exit 1
            fi
          done
          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "The uploaded Android keystore file was not found: $CM_KEYSTORE_PATH"
            exit 1
          fi
      - name: Build signed Android APK for installation and testing
        script: flutter build apk --release
      - name: Build signed Android App Bundle for Google Play
        script: flutter build appbundle --release
    artifacts:
      - Fast/build/app/outputs/flutter-apk/*.apk
      - Fast/build/app/outputs/bundle/release/*.aab
