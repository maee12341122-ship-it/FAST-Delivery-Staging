workflows:
  fast-taiz-android-apk:
    name: FAST Delivery - Android APK 🚀
    max_build_duration: 90
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.taiz_express"
    cache:
      cache_paths: []
    scripts:
      - name: Auto-generate clean & compatible Android directory (v2 embedding)
        script: |
          set -e
          echo "Cleaning and regenerating Android directory..."
          rm -rf android
          flutter create . --platforms=android --org com.example --project-name fast_delivery
          
          # ضبط إصدارات Gradle لتكون متوافقة تماماً
          GRADLE_PROPERTIES="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROPERTIES" ]; then
            sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.7-bin.zip/g' "$GRADLE_PROPERTIES"
          fi
          
          # التأكد من تفعيل التضمين الحديث v2 embedding في AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />' "$MANIFEST_PATH"
            fi
          fi

          # ضمان أن MainActivity يستخدم FlutterActivity الحديثة لتجنب أي خطأ v1
          MAIN_KT="android/app/src/main/kotlin/com/example/fast_delivery/MainActivity.kt"
          MAIN_JAVA="android/app/src/main/java/com/example/fast_delivery/MainActivity.java"
          
          mkdir -p android/app/src/main/kotlin/com/example/fast_delivery
          cat << 'EOF' > "$MAIN_KT"
          package com.example.fast_delivery

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          
          # حذف أي ملفات جافا قديمة قد تسبب تعارضاً
          rm -f "$MAIN_JAVA"
      - name: Check Flutter environment
        script: |
          set -e
          flutter --version
          java -version
      - name: Configure Android SDK paths
        script: |
          set -e
          FLUTTER_SDK="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not configured on the build machine."
            exit 1
          fi
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_SDK" "$ANDROID_SDK" > android/local.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate App Launcher Icon 🖼️
        script: |
          set +e
          flutter pub run flutter_launcher_icons || echo "Launcher icons generation skipped or failed, continuing..."
      - name: Build release APK
        script: flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log

  fast-taiz-google-play-aab:
    name: FAST Delivery - Google Play AAB (signed)
    max_build_duration: 90
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.taiz_express"
    cache:
      cache_paths: []
    scripts:
      - name: Check signing secrets
        script: |
          set -e
          for name in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required Codemagic secret: $name"; exit 1; fi
          done
          if [ ! -f "$CM_KEYSTORE_PATH" ]; then echo "Keystore file not found at CM_KEYSTORE_PATH"; exit 1; fi
      - name: Auto-generate clean & compatible Android directory (v2 embedding)
        script: |
          set -e
          rm -rf android
          flutter create . --platforms=android --org com.example --project-name fast_delivery
          
          GRADLE_PROPERTIES="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROPERTIES" ]; then
            sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.7-bin.zip/g' "$GRADLE_PROPERTIES"
          fi
          
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ] && ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
            sed -i '/<application/a \        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />' "$MANIFEST_PATH"
          fi

          MAIN_KT="android/app/src/main/kotlin/com/example/fast_delivery/MainActivity.kt"
          mkdir -p android/app/src/main/kotlin/com/example/fast_delivery
          cat << 'EOF' > "$MAIN_KT"
          package com.example.fast_delivery

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
      - name: Configure Android SDK
        script: |
          set -e
          FLUTTER_SDK="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}" 
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_SDK" "$ANDROID_SDK" > android/local.properties
      - name: Get packages
        script: flutter pub get
      - name: Build signed Google Play bundle
        script: |
          set -e
          flutter build appbundle --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/bundle/release/*.aab
