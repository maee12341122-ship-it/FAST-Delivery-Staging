workflows:
  fast-delivery-android:
    name: FAST Delivery - APK Build 🚀
    max_build_duration: 60
    working_directory: Fast
    environment:
      flutter: 3.22.2
      vars:
        PACKAGE_NAME: "com.example.taiz_express"
    cache:
      cache_paths: []
    scripts:
      - name: 1. Clean and regenerate fresh Android inside Fast
        script: |
          set -e
          echo "Cleaning old android folder inside Fast..."
          rm -rf android
          echo "Generating fresh android project..."
          flutter create . --platforms=android --org com.example --project-name fast_delivery
          
      - name: 2. Force exact compatible Gradle Wrapper (Gradle 8.7)
        script: |
          set -e
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: 3. Ensure V2 Embedding in AndroidManifest
        script: |
          set -e
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2" />' "$MANIFEST_PATH"
            fi
          fi

      - name: 4. Configure Android SDK local.properties
        script: |
          set -e
          FLUTTER_SDK="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_SDK" "$ANDROID_SDK" > android/local.properties

      - name: 5. Get Flutter Packages
        script: flutter pub get

      - name: 6. Build Release APK
        script: flutter build apk --release --android-skip-build-dependency-validation
        
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log
