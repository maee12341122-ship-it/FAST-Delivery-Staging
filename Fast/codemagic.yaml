workflows:
  build-apk-workflow:
    name: Build Android APK for FAST Delivery
    max_build_duration: 30
    environment:
      flutter: 3.22.2
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Clean build cache
        script: |
          flutter clean
          flutter pub get
      - name: Build Release APK with Skip Flag
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - maeen@example.com
        notify:
          success: true
          failure: true
