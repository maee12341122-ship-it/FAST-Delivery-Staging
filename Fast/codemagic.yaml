workflows:
  fast-taiz-web-pwa:
    name: FAST Delivery - Web PWA 🌐
    max_build_duration: 30
    environment:
      flutter: stable
    cache:
      cache_paths: []
    scripts:
      - name: Check Flutter environment
        script: |
          set -e
          flutter --version
      - name: Enable Flutter Web
        script: |
          set -e
          flutter config --enable-web
      - name: Clean and Get Flutter packages
        script: |
          set -e
          flutter clean
          flutter pub get
      - name: Generate App Launcher Icon 🖼️
        script: |
          set -e
          flutter pub run flutter_launcher_icons || true
      - name: Build Web Release (PWA) 🚀
        script: |
          set -e
          flutter build web --release
      - name: Compress Web Artifacts 📦
        script: |
          set -e
          cd build/web
          zip -r ../web_pwa_release.zip .
    artifacts:
      - build/web_pwa_release.zip
      - build/web/**
