workflows:
  fast-taiz-web-pwa:
    name: FAST Delivery - Web PWA 🌐
    max_build_duration: 15
    environment:
      flutter: stable
    scripts:
      - name: Check Flutter environment
        script: |
          set -e
          flutter --version
      - name: Enable Flutter Web
        script: |
          set -e
          flutter config --enable-web
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get
      - name: Build Web Release 🚀
        script: |
          set -e
          flutter build web --release --no-pub
      - name: Compress Web Artifacts 📦
        script: |
          set -e
          cd build/web
          zip -r ../web_pwa_release.zip .
    artifacts:
      - build/web_pwa_release.zip
      - build/web/**
